name: classroom_finder
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter_tts: ^3.8.5
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  fl_chart: ^0.68.0

  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0
  screenshot: ^1.3.0
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  google_mlkit_barcode_scanning: ^0.10.0
  permission_handler: ^11.0.1

  audioplayers: ^5.2.1
  vibration: ^2.0.0


  # 🔥 Firebase packages
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  google_sign_in: ^6.2.1

  # icons
  font_awesome_flutter: ^10.7.0

  # map 
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  firebase_storage: ^11.7.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/background.png
    - assets/map.png
    - assets/entrance.png
    - assets/sounds/beep.mp3